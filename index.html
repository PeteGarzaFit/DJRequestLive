<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070b">
<meta name="description" content="SI DJ — Super Intelligence DJ. Build your crate. Read your crowd. Own your set.">
<title>SI DJ — Super Intelligence DJ</title>
<style>
:root{--bg:#05070b;--blue:#1769e8;--text:#f5f7fb;--muted:#8993a6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{overflow:hidden}.noise{position:fixed;inset:0;opacity:.045;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
.grid{position:fixed;inset:-20%;background-image:linear-gradient(rgba(23,105,232,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(23,105,232,.06) 1px,transparent 1px);background-size:70px 70px;transform:perspective(700px) rotateX(64deg) translateY(30%);transform-origin:center;mask-image:linear-gradient(to bottom,transparent 5%,black 55%,transparent 100%);animation:grid 18s linear infinite}
@keyframes grid{to{background-position:0 70px,70px 0}}.orb{position:fixed;width:520px;height:520px;border-radius:50%;left:50%;top:42%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(23,105,232,.22),rgba(23,105,232,.07) 30%,transparent 68%);filter:blur(10px);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.7}}.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
nav{height:82px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}.brand span{color:var(--blue)}.status{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#647087}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px 100px}.content{max-width:900px}.kicker{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(23,105,232,.35);background:rgba(23,105,232,.07);border-radius:999px;padding:9px 14px;color:#8db8ff;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 0 40px rgba(23,105,232,.08)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue);animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}
h1{font-size:clamp(72px,12vw,154px);line-height:.8;letter-spacing:-.075em;margin:36px 0 24px;font-weight:850}h1 .si{display:block}.blue{color:var(--blue);text-shadow:0 0 70px rgba(23,105,232,.22)}
.sub{font-size:clamp(20px,2.5vw,30px);font-weight:600;letter-spacing:-.035em;margin:0 auto 18px}.tag{font-size:clamp(17px,2vw,22px);color:var(--muted);margin:0 auto;letter-spacing:-.015em}.tag strong{color:#dce2ed;font-weight:600}
.tease{margin:46px auto 0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{padding:12px 16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);border-radius:12px;color:#9da7b8;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
footer{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:#4d5666;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
@media(max-width:600px){nav{height:68px;padding:0 22px}.status{font-size:9px}main{padding-bottom:90px}.tease{margin-top:32px}.pill{padding:10px 12px;font-size:10px}}
</style>
</head>
<body><div class="grid"></div><div class="orb"></div><div class="noise"></div><div class="wrap">
<nav><div class="brand">SI<span>DJ</span></div><div class="status">SYSTEM INITIALIZING</div></nav>
<main><section class="content"><div class="kicker"><i class="dot"></i> SUPER INTELLIGENCE DJ</div><h1><span class="si">SI<span class="blue">DJ</span></span></h1><p class="sub">The next generation of DJ intelligence is coming.</p><p class="tag"><strong>Build your crate.</strong>&nbsp; Read your crowd. &nbsp;<strong>Own your set.</strong></p><div class="tease"><span class="pill">Music Intelligence</span><span class="pill">Crowd Intelligence</span><span class="pill">Set Intelligence</span></div></section></main>
<footer>SIDJ.LIVE&nbsp;&nbsp; • &nbsp;&nbsp;COMING SOON</footer></div></body></html>
