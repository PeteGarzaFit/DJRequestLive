name: SI DJ Global Knowledge Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  push:
    paths-ignore:
      - 'data/si-dj-knowledge.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build global music knowledge
        run: node scripts/build-si-dj-knowledge.mjs
      - name: Commit refreshed knowledge
        run: |
          git config user.name "SI DJ Knowledge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/si-dj-knowledge/
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh SI DJ global music knowledge"
          git push
