name: Build SI DJ Bridge

on:
  workflow_dispatch:
  push:
    tags:
      - 'bridge-v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Mac desktop installer
        run: npx electron-builder --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: si-dj-bridge-mac
          path: release/SI-DJ-Bridge.dmg

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows desktop installer
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: si-dj-bridge-windows
          path: release/SI-DJ-Bridge-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: si-dj-bridge-mac
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: si-dj-bridge-windows
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/SI-DJ-Bridge.dmg release/SI-DJ-Bridge-Setup.exe --title "SI DJ Bridge ${{ github.ref_name }}" --generate-notes
